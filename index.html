<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Company Location Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-search/dist/leaflet-control-search.min.css"/>

<style>
body{
margin:0;
font-family:Arial;
}

#map{
height:100vh;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-search/dist/leaflet-control-search.min.js"></script>

<script>

var map = L.map('map').setView([23.8103,90.4125],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution:'© OpenStreetMap'
}).addTo(map);


// Layer group for markers
var markersLayer = new L.LayerGroup();
map.addLayer(markersLayer);

var allMarkers = [];

fetch('location.csv')
.then(response => response.text())
.then(data => {

const rows = data.split('\n').slice(1);

rows.forEach(row => {

const cols = row.split(',');

if(cols.length >= 3){

const name = cols[0];
const lat = parseFloat(cols[1]);
const lng = parseFloat(cols[2]);

const location = cols[3] || "N/A";
const manager = cols[4] || "N/A";
const phone = cols[5] || "N/A";

if(!isNaN(lat) && !isNaN(lng)){

var marker = L.marker([lat,lng]);

marker.bindPopup(`
<div style="
    font-family: Arial;
    font-size: 14px;
    line-height: 1.6;
    min-width: 230px;
">
<h3 style="margin:0; color:#2c3e50;">${name}</h3>
<hr>

<p><b>📍 Location:</b> ${location}</p>
<p><b>📌 Latitude:</b> ${lat}</p>
<p><b>📌 Longitude:</b> ${lng}</p>
<p><b>👨‍💼 Manager:</b> ${manager}</p>
<p><b>📞 Phone:</b> ${phone}</p>

</div>
`);

marker.addTo(markersLayer);

marker.name = name;
allMarkers.push(marker);

}
}

});

// SEARCH CONTROL
var searchControl = new L.Control.Search({
layer: markersLayer,
propertyName: 'name',
initial: false,
zoom: 14,
marker: false
});

map.addControl(searchControl);

});

</script>

</body>
</html>
