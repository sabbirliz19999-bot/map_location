<!DOCTYPE html>
<html>
<head>
  <title>Working Map Fix</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    #map { height: 100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script>

let map = L.map('map').setView([23.8103, 90.4125], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 🔥 IMPORTANT: USE RAW GITHUB LINK HERE
const csvUrl = "PASTE_YOUR_RAW_CSV_LINK_HERE";

Papa.parse(csvUrl, {
  download: true,
  header: true,

  complete: function(results) {

    console.log("DATA LOADED:", results.data);

    results.data.forEach(row => {

      if(row.latitude && row.longitude){

        L.marker([
          parseFloat(row.latitude),
          parseFloat(row.longitude)
        ])
        .addTo(map)
        .bindPopup(row.name || "No Name");

      }

    });

  },

  error: function(err){
    console.log("CSV ERROR:", err);
  }
});

</script>

</body>
</html>
