<!DOCTYPE html>
<html>
<head>
  <title>Excel Map Auto Load</title>

  <meta charset="utf-8" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    #map { height: 100vh; }

    #searchBox {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: 300px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<input id="searchBox" placeholder="Search..." />
<div id="map"></div>

<script>
let map = L.map('map').setView([23.8103, 90.4125], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];

// Clear markers
function clearMarkers(){
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
}

// Add marker
function addMarker(row){
  let marker = L.marker([row.latitude, row.longitude]).addTo(map);

  marker.bindPopup(`
    <b>${row.name}</b><br>
    Location: ${row.location}<br>
    Manager: ${row.manager}<br>
    Phone: ${row.phone}
  `);

  markers.push({ marker, data: row });
}

// Search
document.getElementById("searchBox").addEventListener("input", function(e){
  let value = e.target.value.toLowerCase();

  markers.forEach(item => {
    let match =
      (item.data.name || "").toLowerCase().includes(value) ||
      (item.data.location || "").toLowerCase().includes(value) ||
      (item.data.manager || "").toLowerCase().includes(value);

    if(match){
      item.marker.addTo(map);
    } else {
      map.removeLayer(item.marker);
    }
  });
});

// LOAD EXCEL FROM GITHUB
async function loadExcel(){

  // 👉 CHANGE THIS to your GitHub raw file link
  let url = "data.xlsx";

  let response = await fetch(url);
  let arrayBuffer = await response.arrayBuffer();

  let workbook = XLSX.read(arrayBuffer, { type: "array" });

  // 👉 YOUR SHEET NAME
  let sheetName = "test location";

  let sheet = workbook.Sheets[sheetName];

  if(!sheet){
    alert("Sheet not found: " + sheetName);
    return;
  }

  let data = XLSX.utils.sheet_to_json(sheet);

  clearMarkers();

  data.forEach(row => {
    if(row.latitude && row.longitude){
      addMarker(row);
    }
  });
}

loadExcel();
</script>

</body>
</html>
