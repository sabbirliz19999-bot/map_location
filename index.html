<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Company Location Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Search plugin CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-search/dist/leaflet-control-search.min.css"/>

<style>
body{
margin:0;
font-family:Arial;
}

#map{
height:100vh;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Search plugin JS -->
<script src="https://unpkg.com/leaflet-control-search/dist/leaflet-control-search.min.js"></script>

<script>

var map = L.map('map').setView([23.8103,90.4125],7);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);


// marker layer group (search er jonno lagbe)
var markersLayer = new L.LayerGroup();
map.addLayer(markersLayer);

var allMarkers = [];

fetch('location.csv')
.then(response => response.text())
.then(data => {

const rows = data.split('\n').slice(1);

rows.forEach(row => {

const cols = row.split(',');

if(cols.length >= 4){

const name = cols[0];
const lat = parseFloat(cols[1]);
const lng = parseFloat(cols[2]);
const location = cols[3];

var marker = L.marker([lat,lng]);

marker.bindPopup(
`
<b>${name}</b><br>
📍 ${location}<br>
Latitude: ${lat}<br>
Longitude: ${lng}
`
);

marker.addTo(markersLayer);

marker.name = name; // search use korar jonno

allMarkers.push(marker);
}

});

// SEARCH CONTROL
var searchControl = new L.Control.Search({
layer: markersLayer,
propertyName: 'name',
initial: false,
zoom: 14,
marker: false
});

map.addControl(searchControl);

});

</script>

</body>
</html>
