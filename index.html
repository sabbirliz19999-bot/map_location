<!DOCTYPE html>
<html>
<head>
  <title>GitHub Map Working</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    #map { height: 100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script>

// MAP INIT
let map = L.map('map').setView([23.8103, 90.4125], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// MARKERS ARRAY
let markers = [];

// LOAD CSV (IMPORTANT FIX HERE)
Papa.parse("location.csv", {
  download: true,
  header: true,

  complete: function(results) {

    console.log("DATA LOADED:", results.data);

    results.data.forEach(row => {

      if(row.latitude && row.longitude){

        let marker = L.marker([
          parseFloat(row.latitude),
          parseFloat(row.longitude)
        ]).addTo(map);

        marker.bindPopup(
          `<b>${row.name}</b><br>${row.location}`
        );

        markers.push(marker);
      }

    });

  },

  error: function(err){
    console.log("ERROR LOADING CSV:", err);
  }
});

</script>

</body>
</html>
