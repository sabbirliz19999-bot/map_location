<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Map Popup UI</title>

<style>
body {
  font-family: Arial, sans-serif;
}

/* POPUP WRAPPER */
.popup-card {
  width: 420px;
  display: flex;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  overflow: hidden;
}

/* LEFT SECTION */
.popup-left {
  width: 60%;
  padding: 16px 18px;
  border-right: 1px solid #eee;
}

.popup-left h3 {
  margin: 0 0 10px;
  font-size: 14px;
  color: #1f4fff;
  letter-spacing: 0.5px;
}

.info-row {
  margin-bottom: 10px;
}

.label {
  font-weight: bold;
  font-size: 12px;
  color: #444;
}

.value {
  font-size: 13px;
  color: #222;
  margin-top: 2px;
}

/* RIGHT SECTION */
.popup-right {
  width: 40%;
  padding: 16px;
  text-align: center;
}

.avatar {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #e6ecff;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #1f4fff;
}

.manager-name {
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 6px;
}

.phone {
  font-size: 12px;
  color: #555;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

/* ICON STYLE (simple) */
.icon {
  color: #1f4fff;
}
</style>
</head>

<body>

<div class="popup-card">

  <!-- LEFT SIDE -->
  <div class="popup-left">
    <h3>LOCATION DETAILS</h3>

    <div class="info-row">
      <div class="label">Name</div>
      <div class="value">Company A</div>
    </div>

    <div class="info-row">
      <div class="label">Latitude</div>
      <div class="value">23.8103</div>
    </div>

    <div class="info-row">
      <div class="label">Longitude</div>
      <div class="value">90.4125</div>
    </div>

    <div class="info-row">
      <div class="label">Location</div>
      <div class="value">Dhaka, Bangladesh</div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="popup-right">
    <div class="avatar">👤</div>

    <div class="manager-name">Manager Name</div>

    <div class="phone">
      <span class="icon">📞</span>
      +880 1234 567890
    </div>
  </div>

</div>

</body>
</html>
